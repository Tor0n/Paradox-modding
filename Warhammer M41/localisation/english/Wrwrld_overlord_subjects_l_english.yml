 #Specialist types
 specialist_agrarian: "Аграрий"
 specialist_agrarian_desc: "Подданный сосредоточится на выращивании пищи в ущерб науке и промышленности."
 specialist_agrarian_summary: "$text_icon_preset_agrarian$ Аграрии специализируются на выращивании пищи в ущерб науке и промышленности."
 specialist_extractorium: "Экстракториум"
 specialist_extractorium_desc: "Подданный сосредоточится на добыче минералов и выработке энергии в ущерб науке, что создают слабую неконкурентоспособную промышленность."
 specialist_extractorium_summary: "$text_icon_preset_extractorium$ Экстракториумы специализируются на добыче минералов и выработке энергии в ущерб науке и промышленности."
 specialist_state_corporation: "Госкорпорация"
 specialist_state_corporation_desc: "Подконтрольная корпорация, чья задача развитие торговли на территории страны и извлечение энергокредитов за ее пределами."
 specialist_state_corporation_summary: "$text_icon_preset_state_corporation$ Госкорпорации специализируются на торговле и располагаются, как правило, на небольшой территории."
 specialist_industrialist: "Индустриалист"
 specialist_industrialist_desc: "Подданный сосредоточится на производстве сплавов и товаров массового спроса в ущерб добывающей отрасли."
 specialist_industrialist_summary: "$text_icon_preset_industrialist$ Индустриалисты специализируются на производстве сплавов и товаров массового спроса в ущерб добывающей отрасли."
 specialist_space_marines: "Космодесант"
 specialist_space_marines_desc: "Подданный сосредоточится на нападении в ущерб производству ресурсов."
 specialist_space_marines_summary: "$text_icon_preset_space_marines$ Космодесанты специализируются на нападении в ущерб производству ресурсов."
 specialist_holy_order: "Священный Орден"
 specialist_holy_order_desc: "Подконтрольный священный орден, чья задача помощь в войне с еретиками и охрана паломников."
 specialist_holy_order_summary: "$text_icon_preset_holy_orderr$ Священные ордена специализируются на нападении и священном едистве."
 specialist_inquisition: "Инквизиция"
 specialist_inquisition_desc: "Подконтрольная инквизиция станет надежной твердыней веры и новой святыней."
 specialist_inquisition_summary: "$text_icon_preset_inquisition$ Инквизиции специализируются на обороне и священном едистве."
