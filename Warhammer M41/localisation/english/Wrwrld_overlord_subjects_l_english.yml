 #Subject presets descriptions
 preset_agrarian_desc: "Аграрий — это подданный-специалист, пожертвовавший наукой и промышленностью ради выращивания пищи."
 preset_extractorium_desc: "Экстракториум — это подданный-специалист, пожертвовавший наукой и промышленностью ради добычи ископаемых и выработки энергии."
 preset_state_corporation_desc: "Госкорпорация — это подданный-специалист, представляющий собой подконтрольную корпорацию."
 preset_industrialist_desc: "Индустриалист — это подданный-специалист, занимающийся производством промышленных ресурсов в ущерб добывающей отрасли."
 preset_space_marines_desc: "Космодесант — это подданный-специалист, сконцентрированный на военном деле в ущерб производству базовых ресурсов."
 preset_holy_order_desc: "Священный Орден — это подданный-специалист, сконцентрированный на вере и ее защите за пределами государства в ущерб производству базовых ресурсов."
 preset_inquisition_desc: "Инквизиция — это подданный-специалист, сконцентрированный на вере и ее защите в ущерб производству базовых ресурсов."
 #Subject presets flavor text
 preset_agrarian_flavor_desc: "Этот подданный специализируется на пище. Деиндустриализация позволяет сосредоточить все усилия и пространство на многочисленных плантациях, полях и пастбищах."
 preset_extractorium_flavor_desc: "Этот подданный специализируется на минералах и энергии."
 preset_state_corporation_flavor_desc: "Этот подданный - корпорация, получившая в арену владения территории для продвижения своей деятельности."
 preset_industrialist_flavor_desc: "Этот подданный специализируется на промышленности."
 preset_space_marines_flavor_desc: "Этот подданный специализируется на военных вопросах и отлично разбирается в вопросах нападения, предоставляя сюзерену знания и помогая в войнах. Из-за подобной узконаправленности государство сильно зависит от материальной поддержки."
 preset_holy_order_flavor_desc: "Этот подданный ставит главной целью вопрос распространения веры, помогая в праведных войнах сюзерена. Это относительно самостоятельный экономически подданный, но все же может нуждаться в материальной поддержке."
 preset_inquisition_flavor_desc: "Этот подданный занимается защитой веры от еретиков и внешний угроз, предоставляя сюзерену знания и защищая его. Это относительно самостоятельный экономически подданный, но все же может нуждаться в материальной поддержке."
