l_russian:
 edict_сorpses_briquettes: "Указ о трупных батончиках"
 edict_сorpses_briquettes_desc: "Удабная форма еды, экономия в каждом солдате. Да не оставит их Император голодными!"
 edict_imperium_exploitation: "Эксплуатация Империума"
 edict_imperium_exploitation_desc: "Работайте во имя Бога-Император!"
 
 edict_veneration_khorne: "Почитание Кхорна"
 edict_veneration_khorne_desc: "Черепа и кровь - вот что жаждет Кхорн."
 edict_veneration_tzeentch: "Почитание Тзинча"
 edict_veneration_tzeentch_desc: "Устраивайте интриги, распространяйте ложь, стремитесь к непостижимым знаниям, подарите Тзинчу всю вашу надежду и он воздаст вам большее."
 edict_veneration_nurgle: "Почитание Нургла"
 edict_veneration_nurgle_desc: "Жизнь - это лишь начало новой смерти, новая смерть - лишь начало новой жизнь, и нет этому конца..."
 edict_veneration_slaanesh: "Почитание Слаанеш"
 edict_veneration_slaanesh_desc: "Ваши желания, ваше наслаждение - всему этому нет предела, так что достигните совршенства в том, что обожаете. Питайте же Слаанеш!"

