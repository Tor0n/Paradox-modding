l_russian:
 #Rewrited living standards
 living_standard_utopian: "Утопическое изобилие"
 living_standard_utopian_tooltip: "Уровень жизни $living_standard_utopian$ обеспечивает каждому представителю этой расы доступ к буквально любым роскошествам, какие только можно вообразить.\n\n$UTOPIAN_ABUNDANCE_POP_EFFECTS$\n\n$UNEMPLOYED_PRODUCE_UNITY_RESEARCH$"
 living_standard_utopian_tooltip_delayed: "§LРеальность такова, что мы не можем устранять каждое желание, удовлетворяя каждую потребность. Но мы можем попытаться.§!"
 living_standard_shared_burden: "Разделение тягот"
 living_standard_shared_burden_tooltip: "$living_standard_shared_burden$ гарантирует равное распределение ресурсов между всеми членами общества.\n\n$SHARED_BURDEN_POP_EFFECTS$\n\n$UNEMPLOYED_PRODUCE_UNITY$"
 living_standard_shared_burden_tooltip_delayed: "§LОт каждого по способностям, каждому по потребностям.§!"
 living_standard_academic_privilege: "Привилегия образования"
 living_standard_academic_privilege_tooltip: "Уровень жизни $living_standard_academic_privilege$ требует уделять первостепенное внимание образованию населения во имя научного прогресса.\n\n$ACADEMIC_PRIVILEGE_POP_EFFECTS$\n\n$UNEMPLOYED_REDUCED_HAPPINESS$"
 living_standard_academic_privilege_tooltip_delayed: "§LЗнания — это ключ к власти.§!"
 living_standard_good: "Социальное обеспечение"
 living_standard_good_tooltip: "Для уровня жизни $living_standard_good$ характерно стремление улучшить жизнь бедных слоев общества за счет щедрых социальных политик.\n\n$SOCIAL_WELFARE_POP_EFFECTS$\n\n$UNEMPLOYED_PRODUCE_UNITY$"
 living_standard_good_tooltip_delayed: "§LЗабота о потребностях народа — это самая важная обязанность государства.§!"
 living_standard_normal: "Достойные условия"
 living_standard_normal_tooltip: "Уровень жизни $living_standard_normal$ обеспечивает большинство представителей расы всем, что необходимо для приемлемого качества жизни.\n\n$DECENT_LIVING_STANDARDS_POP_EFFECTS$\n\n$UNEMPLOYED_REDUCED_HAPPINESS$"
 living_standard_normal_tooltip_delayed: "§LПренебрежение нуждами наших подданных является в конечном счете проигрышной позицией.§!"
 living_standard_stratified: "Стратифицированная экономика"
 living_standard_stratified_tooltip: "$living_standard_stratified$ отличается упором на интересы правящих классов за счет обнищавших масс.\n\n$STRATIFIED_LIVING_STANDARDS_POP_EFFECTS$\n\n$UNEMPLOYED_REDUCED_HAPPINESS$"
 living_standard_stratified_tooltip_delayed: "§LЕсли они хотят в жизни лучшей участи, им придется ради этого трудиться.§!"
 
 
 #living_standard_hive_mind_tooltip: "Пусть трутни не видят пользы в роскоши, для их материального обеспечения все-таки требуется масса ресурсов."
 living_standard_subsistence_tooltip: "Уровень жизни $living_standard_subsistence$ обеспечивает поселения этой расы лишь самым необходимым.\n\n$SUBSISTENCE_POP_EFFECTS$\n\n$UNEMPLOYED_REDUCED_HAPPINESS$"
 living_standard_organic_trophy_tooltip: "Этот уровень жизни предусматривает содержание небольшой популяции органических существ в качестве экспонатов, которых всячески холят и лелеют.\n\n$ORGANIC_TROPHY_POP_EFFECTS$"
 living_standard_chemical_bliss_tooltip: "Средства развлечения находятся в свободном доступе, а прием наркотиков вызывает эйфорический ступор. Поселения счастливы, но пользы от них никакой нет.\n\n$living_standard_chemical_bliss_happiness_tooltip$"
 living_standard_decadent_tooltip: "$living_standard_decadent$ означает больше ресурсов и роскоши для привилегированных членов общества.\n\n$DECADENT_LIVING_STANDARDS_POP_EFFECTS$\n\n"
 living_standard_dystopian_society_tooltip: "$living_standard_dystopian_society$ делает правящие классы единственными, кто получает все необходимое, полностью игнорируя низшие классы.\n\n$DYSTOPIAN_LIVING_STANDARDS_POP_EFFECTS$\n\n$UNEMPLOYED_REDUCED_HAPPINESS$"
 #living_standard_worker_ownership_tooltip: "$living_standard_worker_ownership$ гарантирует каждому рабочему право участия в прибылях предприятия. Стоимость жизни и социальная ответственность равномерно распределяются между всеми участниками."
 