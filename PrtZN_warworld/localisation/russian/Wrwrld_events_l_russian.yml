l_russian:
 WrWrld_game_start.0.name: "Перед началом игры.."
 WrWrld_game_start.0.desc: "Здравствуй игрок!\n\ В первые пять игровых дней будет происходить активация скриптов, это вызовет лаги и замедления производительности, но затем всё пройдёт и можно будет спокойно играть дальше. Мод работает очевидно не так быстро как обычная игра, но обычно по мере продолжения вечной войны, игра начинает работать быстрее. Я также постарался не нагружать мод большим числом новых лишних расчётов.\n\ Данный ивент я планирую в будущем использовать для настройки мода игроком при старте и возможно сообщать некоторые детали нового обновления, поэтому не пролистывай ивент, а читай на всякий случай после каждого обновления.\n\ Обратите также внимание, если у вас есть пустые системы на карте и появились страны как в обычной игре и их очевидно быть не должно, скорее всего у вас не хватает какого-то необходимого длс для мода, вы конечно можете продолжить играть так, но если вам очень не нравится эта проблема, то вы можете самостоятельно изменить файлы стран в моде, зачастую замены гражданских моделей и портретов, достаточно, чтобы отвязать мод от проблемных для вас длс.\n\ Также желательно повысить стоимость научных исследований и принятия традиций."
 WrWrld_game_start.0.a: "О моде, багах и условностях."
 WrWrld_game_start.0.b: "Настройка (в разработке)."
 WrWrld_game_start.0.c: "Перейти к настройке."
 
 WrWrld_game_start.1.name: "О моде, багах и условностях."
 WrWrld_game_start.1.desc: "Изначально это не планировалось модом про вархаммер, но по итогу я постарался объединить труд множества мододелов до меня про вархаммер, для того, чтобы в будущем вы могли это использовать как отправную точку для создания уже своей новой версии вархаммер мода.\n\ На данный момент я думаю стоит уточнить такое обстоятельство, что мод всё ещё в разработке и над модом работаю я в одиночку, это огромный труд требующий много времени и я банально не могу здесь сделать всё сам в одиночку, поэтому не стоит например мне говорить про сломавшиеся картинки городов, я знаю, но у меня есть много более важных задач, что непосредственно влияют на геймплей. Не стоит ждать, что я починю города например, лучше сделайте это сами, загрузите свой сабмод в мастерскую и дайте на него ссылку в комментариях к нашему моду, я тогда смогу интегрировать ваши исправления, в основной мод.\n\ Я поработал над архитектурой файлов и пробую написать некоторую инструкцию к моду, чтобы вам было проще разобраться как его обновлять в случае моей смерти или как делать на него сабмоды.\n\ В моде на данный момент есть баг который я не знаю как исправить, возможно иногда вы видите пустую систему которая где-то появляется, это как раз и есть данный баг, если он сильно портит внешний вид отображения стран, лучше перезапустить игру, либо просто отнестись с терпением.\n\ Также в моде присутствует очень большое число условностей, например некоторые династии некронов объединены в одну, а от сегментума ультимы отделены 2 государства, чтобы игроку было проще контроллировать и так большую территорию. Я также например посчитал, что экзодиты будут интереснее как развитая фракция изоляционистов, а не как просто миры примитивных цивилизаций у которых в этом суровом мире просто нет шанса выжить."
 WrWrld_game_start.1.a: "Вернуться к стартовому ивенту."
 
 WrWrld_game_start.11.name: "Определение развития событий и мира"
 WrWrld_game_start.11.desc: "В моде предоставлен выбор из трёх вариантов которые определят, какие события смогут произойти.\n\ Канон заставит мир развиваться по тем событиям, что были в каноне. Например в моде есть возможность смены легионов хаоса на другие, но в "каноне" такого не будет, Тысяча Сынов останется под руководством Магнуса и произойдёт Великий Разлом. Конклав Феникса обязательно станет Детьми Императора исключая иные варианты развития событий.\n\ Канон плюс сохранит каноничное развитие событий, но будет включать в себя дальнейшее развитие канона как я его вижу, например некоторые из некронов смогут провести перенос себя в биологические тела, как они и хотят(на данный момент ещё не сделано), а некоторые из хаоситов в случае больших успехов трансформируются в Домен своих Богов в материальном мире.\n\ Свободный выбор откроет возможности сменить руководство своих стран, например можно в Коморре сменить Асдрубаэля Векта и его кабал на другой кабал, в Лигах Вотанна например тоже можно будет сменить главенствующую силу."
 WrWrld_game_start.11.a: "Канон плюс"
 WrWrld_game_start.11.b: "Канон"
 WrWrld_game_start.11.c: "Свободный выбор"
 
 WrWrld_game_start.12.name: "Варп шторма"
 WrWrld_game_start.12.desc: "Включить варп шторма на карте которые будут отображены через созданные туманности?"
 WrWrld_game_start.12.a: "Без туманностей"
 WrWrld_game_start.12.b: "Включить туманности"
 
 black_crusades.name: "Чёрный Крестовый Поход"
 black_crusades.desc: "Долгая война идёт и понемногу чаша весов склоняется в нашу сторону, пришло время нанести новый удар по Империуму! Время отложить распри и в едином порыве ударить по всем фронтам!"
 black_crusades.a: "Боги дают нам ресурсы из варпа, но и мы достанем свои накопления."
 black_crusades.b: "Мы подумаем об этом предложение... А хотя нет... Определенно начнем!"
 black_crusades_imp.desc: "Абаддон начал новый Чёрный Крестовый Поход против нас, он смог снова объединить всех хаоситов и на время прекратить войны между ними, также боги хаоса дадут им новые ресурсы на войну с нами."
 black_crusades_imp.a: "Приготовиться защищаться!"
 
 WrWrld_death_guard.31.name: "Гнев Нургла"
 WrWrld_death_guard.31.desc: "Нургл в ярости от того, что мы не ведём успешную войну во имя него. Он сместит Мортариона в надежде, что новое руководство Гвардии Смерти, сможет лучше вести войну."
 WrWrld_death_guard.31.a: "Свобода"
 
 WrWrld_death_guard.32.name: "Замена Мортариона"
 WrWrld_death_guard.32.desc: "Нургл решил избавиться от неумелого Мортариона и заменить его кем-то новым. Кого же он выберет?"
 WrWrld_death_guard.32.a: "Гвардейцев, но предлагающих другой подход"
 WrWrld_death_guard.32.b: "Гвардии нужно лишь сменить Мортариона, а остальное оставить как есть"
 WrWrld_death_guard.32.c: "Поможет только полная замена гвардии кем-то другим"
 
 WrWrld_death_guard.33.name: "Новый подход Гвардии"
 WrWrld_death_guard.33.desc: "Гвардию Смерти возглавит?"
 WrWrld_death_guard.33.a: "Тиф"
 WrWrld_death_guard.33.b: "Гнойный Шрам"
 WrWrld_death_guard.33.c: "Любимые сыновья"
 WrWrld_death_guard.33.d: "Братство гнильцов"
 WrWrld_death_guard.33.e: "Апостолы заражения под властью Некросия"
 WrWrld_death_guard.33.f: "Плодовитые"
 WrWrld_death_guard.33.g: "Плачущий Легион"
 
 WrWrld_death_guard.34.name: "Новые лидеры Гвардии"
 WrWrld_death_guard.34.desc: "Гвардию Смерти возглавят?"
 WrWrld_death_guard.34.a: "Лорды Тишины"
 WrWrld_death_guard.34.b: "Испорченные"
 WrWrld_death_guard.34.c: "Бледная Длань"
 WrWrld_death_guard.34.d: "Гнилой хор"
 WrWrld_death_guard.34.e: "Трупоизготовители"
 WrWrld_death_guard.34.f: "Гончие-падальщики"
 
 WrWrld_death_guard.35.name: "Замена Гвардии Смерти"
 WrWrld_death_guard.35.desc: "Гвардию Смерти заменит?"
 WrWrld_death_guard.35.a: "Чистка"
 WrWrld_death_guard.35.b: "Расколотые"
 WrWrld_death_guard.35.c: "Лорды Распада"
 WrWrld_death_guard.35.d: "Дети Блейна"
 
 WrWrld_death_guard.36.name: "Неожиданное перемирие с Гвардией Смерти?!"
 WrWrld_death_guard.36.desc: "Как докладывает наша разведка, что-то случилось в Гвардии Смерти и похоже Мортариона больше нет... Новая сила его заменившая, решила временно прекратить атаки на нас, скоцентрировавшись на ксеносах, учитывая наше положение, лучше воспользоваться этой передышкой."
 WrWrld_death_guard.36.a: "Неожиданно!"
 WrWrld_death_guard.37.name: "Черёд Империума..."
 WrWrld_death_guard.37.desc: "Мы достаточно принесли даров Нургла ксеносам. Укрепили свои позиции и пора попробовать взяться за Империум снова!"
 WrWrld_death_guard.37.a: "Война!"
 
 WrWrld_death_guard.38.name: "Поражение агро-миров"
 WrWrld_death_guard.38.desc: "Со всех уголков поступают сообщения о поражении агромиров и всего производства пищи, нет сомнения, что это проделки агентов Нургла. Это новая угроза с которой ещё не сталкивался Империум, на её решение уйдут многие годы, невообразимому числу людских ресурсов придётся пропасть."
 WrWrld_death_guard.38.a: "Император, дай нам сил пережить это"
 WrWrld_death_guard.39.name: "Поражение агро-миров Империума"
 WrWrld_death_guard.39.desc: "Сконцентрировав все силы на своей задачи по подрыву агромиров империума, нам удалось создать новые виды эпидемий идеально подходящих для агромиров и способные сами распространяться между ними. Предполагаемое снижение производительности 20% которое в ближайшее время накроет весь Империум благодаря засланным возбудителям."
 WrWrld_death_guard.39.a: "Сотни миллиардов умрут и сотни миллиардов будут болеть!"
 
 WrWrld_death_guard.40.name: "Договор с Гвардией Смерти"
 WrWrld_death_guard.40.desc: "Гвардия Смерти желает улучшить отношения с нами. Это будет взаимовыгодное сотрудничество."
 WrWrld_death_guard.40.a: "Хорошо"
 WrWrld_death_guard.41.name: "Договор с Механикум"
 WrWrld_death_guard.41.desc: "Мы желаем обладать большим числом различнейшей техники, поможем же Механикум, а они помогут нам в ответ."
 WrWrld_death_guard.41.a: "Симбиоз"
 WrWrld_death_guard.42.name: "Набег Гвардии Смерти"
 WrWrld_death_guard.42.desc: "Гвардия Смерти совершила набег на наши транспортные флотилии в космосе"
 WrWrld_death_guard.42.a: "Мы отомстим"
 
 WrWrld_death_guard.100.name: "Нургл в материуме"
 WrWrld_death_guard.100.desc: "Не нужно обманываться, мы всего лишь пешки неподвластной нам могущественной силы в лице Бога Хаоса. Наш Бог становится всё сильнее и его сила и влияние уже прорываются в материум с новой силой, мы буквально становимся "назначенными управленцами", в домене Бога который расположен в материуме. Вместе с ростом силы и влияния, материум как и имматериум, всё больше становится местом великой игры Богов. В знак признания наших заслуг, Бог позволит нам сохранить наши знамёна и сделать их символом домена в материуме."
 WrWrld_death_guard.100.a: "Новая эра грядёт."
 WrWrld_death_guard.100.b: "Мы ещё слишком слабы, чтобы перейти на этот новый уровень"
 
 WrWrld_world_eaters.20.name: "Гнев Кхорна"
 WrWrld_world_eaters.20.desc: "Кхорн в ярости от того, что мы не ведём успешную войну во имя него. Он сместит Ангрона в надежде, что новое руководство пожирателей миров, сможет лучше вести войну."
 WrWrld_world_eaters.20.a: "Свобода"
 WrWrld_world_eaters.21.name: "Смена руководства Пожирателей миров"
 WrWrld_world_eaters.21.desc: "Кхорн убивает Ангрона который был недостаточно успешен в ведении войны. Новым лидером пожирателей миров станет?"
 WrWrld_world_eaters.21.a: "Кхарн и его мясная орда"
 WrWrld_world_eaters.21.b: "Собиратель Черепов У'Зхул и его Поклявшиеся Черепам"
 WrWrld_world_eaters.21.c: "Коссолакс и его изгнанники"
 WrWrld_world_eaters.21.d: "А что если меньшая сила с новым подходом?"
 
 WrWrld_world_eaters.22.name: "Новый подход"
 WrWrld_world_eaters.22.desc: "В надежде исправить ситуацию Кхорн позволит ныне меньшей силе, стать во главе остатков легиона. Кому Кхорн окажет поддержку?"
 WrWrld_world_eaters.22.a: "Гладиаторский отряд 331"
 WrWrld_world_eaters.22.b: "Огненные всадники в союзе с Мясниками Пустоты"
 WrWrld_world_eaters.22.c: "Наглые мясники"
 WrWrld_world_eaters.22.d: "Кровожадные Напивающиеся Кровью"
 WrWrld_world_eaters.22.e: "Канос Девораторес"
 
 WrWrld_world_eaters.23.name: "Снова разочарование"
 WrWrld_world_eaters.23.desc: "Кхарн оказался также неуспешным. Кхорн позволит сменить его на одну из двух сильных банд в его воинстве."
 WrWrld_world_eaters.23.a: "Убийцы жизни."
 WrWrld_world_eaters.23.b: "Ярость Ангрона."
 
 WrWrld_world_eaters.24.name: "Смена лидеров"
 WrWrld_world_eaters.24.desc: "За прошедшие десятилетия в нашу территорию стеклось множество различных последователей Кхорна, возможно кто-то уже превосходит нас и остальных по своему влиянию. Кто же на данный момент самый влиятельный в этом регионе?"
 WrWrld_world_eaters.24.a: "Кровавая Резня."
 WrWrld_world_eaters.24.b: "Собиратель Черепов У'Зхул и его Поклявшиеся Черепам."
 WrWrld_world_eaters.24.c: "Собиратели черепов."
 WrWrld_world_eaters.24.d: "Освящённые."
 WrWrld_world_eaters.24.e: "Канос Девораторес."
 WrWrld_world_eaters.24.f: "Наглые мясники."
 WrWrld_world_eaters.24.g: "Огненные всадникив союзе с Мясниками Пустоты."
 
 WrWrld_world_eaters.100.name: "Кхорн в материуме"
 WrWrld_world_eaters.100.desc: "Не нужно обманываться, мы всего лишь пешки неподвластной нам могущественной силы в лице Бога Хаоса. Наш Бог становится всё сильнее и его сила и влияние уже прорываются в материум с новой силой, мы буквально становимся "назначенными управленцами", в домене Бога который расположен в материуме. Вместе с ростом силы и влияния, материум как и имматериум, всё больше становится местом великой игры Богов. В знак признания наших заслуг, Бог позволит нам сохранить наши знамёна и сделать их символом домена в материуме."
 WrWrld_world_eaters.100.a: "Новая эра грядёт."
 WrWrld_world_eaters.100.b: "Мы ещё слишком слабы, чтобы перейти на этот новый уровень"
 
 WrWrld_thousand_sons.5.name: "Ариман и его происки"
 WrWrld_thousand_sons.5.desc: "До нас доходит информация, что относительно скоро, Ариман готовится провести вторую рубрику."
 WrWrld_thousand_sons.5.a: "Нужно действовать!"
 
 WrWrld_thousand_sons.7.name: "Вторая рубрика"
 WrWrld_thousand_sons.7.desc: "Ариман проводит вторую рубрику(уже вернувшись из будущего, чтобы предотвратить появление Пиродомона) с целью воскресить легион и готов даже пожертвовать своей жизнью."
 WrWrld_thousand_sons.7.a: "Кнекку вмешивается в обряд, чтобы восстановить разрушенный разум Магнуса!"
 WrWrld_thousand_sons.7.b: "Ариман проводит рубрику, хотя и без успеха, но он защищается от вмешательства!"
 WrWrld_thousand_sons.7.c: "Третьи силы вмешиваются!"
 
 WrWrld_thousand_sons.8.name: "Вмешательство третьих сил"
 WrWrld_thousand_sons.8.desc: "То, что начало происходить, невозможно описать, кто и зачем это сделал непонятно, но в ходе начавшейся смуты появился новый претендент на главу Тысячи Сынов."
 WrWrld_thousand_sons.8.a: "Кто-то из людей Аримана, решил предать его и занять его место."
 WrWrld_thousand_sons.8.b: "Кто-то из людей Магнуса, решил предать его и занять его место."
 WrWrld_thousand_sons.8.c: "Кто-то действующий сам по себе увидел в этом свой шанс."
 
 WrWrld_thousand_sons.9.name: "Перехват власти"
 WrWrld_thousand_sons.9.desc: "Кто сумел взять власть по итогу?"
 WrWrld_thousand_sons.9.a: "Серебряные Сыновья"
 WrWrld_thousand_sons.9.b: "Багровые Сыны"
 WrWrld_thousand_sons.9.c: "Великий Орден Герметических Клинков"
 WrWrld_thousand_sons.9.d: "Варп-призраки"
 
 WrWrld_thousand_sons.10.name: "Перехват власти"
 WrWrld_thousand_sons.10.desc: "Кто сумел взять власть по итогу?"
 WrWrld_thousand_sons.10.a: "Сектаи просперин"
 WrWrld_thousand_sons.10.b: "Красное эхо"
 WrWrld_thousand_sons.10.c: "Призма Судьбы"
 WrWrld_thousand_sons.10.d: "Тизканское Воинство"
 WrWrld_thousand_sons.10.e: "Рабы Магнуса"
 
 WrWrld_thousand_sons.11.name: "Перехват власти"
 WrWrld_thousand_sons.11.desc: "Кто сумел взять власть по итогу?"
 WrWrld_thousand_sons.11.a: "Измученные"
 WrWrld_thousand_sons.11.b: "Сыны Циклопа"
 WrWrld_thousand_sons.11.c: "Кристальные предвестники"
 WrWrld_thousand_sons.11.d: "Отражённые"
 
 WrWrld_thousand_sons.20.name: "Великий разлом"
 WrWrld_thousand_sons.20.desc: "Мы долго готовились к столь сложному колдовству, но теперь мы готовы создать мощнейший варп-шторм, чтобы разорвать империум на две части!"
 WrWrld_thousand_sons.20.a: "Приступим."
 
 WrWrld_thousand_sons.21.name: "Великий разлом"
 WrWrld_thousand_sons.21.desc: "К нам поступают сообщения которые сложно даже осознать. Но всё говорит о том, что случилась величайшая катастрофа в галактике. Сейчас галактика разорвана на две части грандиознейшим варп штормом в известной нам истории. Перемещение через него практически невозможно, но в галактике остались некоторые стабильные проходы через него."
 WrWrld_thousand_sons.21.a: "Не могу поверить, что это может быть правдой."
 
 WrWrld_thousand_sons.22.name: "Королевство Колдунов"
 WrWrld_thousand_sons.22.desc: "Поскольку с началом нового тысячелетия наблюдается рост числа псайкеров, Магнус стремится создать для них безопасный дом - своё королевство, где они будут в защите от преследований Империума."
 WrWrld_thousand_sons.22.a: "Все выиграют от этого."
 
 WrWrld_thousand_sons.100.name: "Тзинч в материуме"
 WrWrld_thousand_sons.100.desc: "Не нужно обманываться, мы всего лишь пешки неподвластной нам могущественной силы в лице Бога Хаоса. Наш Бог становится всё сильнее и его сила и влияние уже прорываются в материум с новой силой, мы буквально становимся "назначенными управленцами", в домене Бога который расположен в материуме. Вместе с ростом силы и влияния, материум как и имматериум, всё больше становится местом великой игры Богов. В знак признания наших заслуг, Бог позволит нам сохранить наши знамёна и сделать их символом домена в материуме."
 WrWrld_thousand_sons.100.a: "Новая эра грядёт."
 WrWrld_thousand_sons.100.b: "Мы ещё слишком слабы, чтобы перейти на этот новый уровень"
 
 WrWrld_emperors_children.10.name: "Конклав Феникса и Дети Императора"
 WrWrld_emperors_children.10.desc: "После поражения у Терры во время Ереси Хоруса, легион детей императора отступил в око ужаса и вёл там войны за рабов против других легионов хаоса, Фулгрим же всё больше отстранялся от управления легионом и по итогу легион детей императора деградировал и разложился на множество варбанд. Конклав Феникса под руководством Эйдолона ставит цель собрать воедино легион детей императора и вернуть ему былую славу."
 WrWrld_emperors_children.10.a: "Вернём славу Детей Императора!"
 
 WrWrld_emperors_children.11.name: "Господствующая группировка"
 WrWrld_emperors_children.11.desc: "Среди разрозненных осколков Детей Императора, на данный момент самым влиятельным является Конклав Феникса, но, что если за последние два с лишним десятилетия Конклав Феникса растерял своё влияние и уже пора другой группировке занять лидирующее положение среди Космодесанта Слаанеш?"
 WrWrld_emperors_children.11.a: "Конклав Феникса продолжит свой путь!"
 WrWrld_emperors_children.11.b: "Консорциум Фабия Бала создаст новых людей!"
 WrWrld_emperors_children.11.c: "Безупречные Люциуса поведут самодовольный поход насилия!"
 WrWrld_emperors_children.11.d: "Безупречное воинство воссядет по правую руку от Слаанеш!"
 WrWrld_emperors_children.11.e: "Констриктус будет "Творить"!"
 WrWrld_emperors_children.11.f: "Погребальный хор создаст гармонию через дестабилизацию!"
 
 WrWrld_emperors_children.12.name: "Возрождение Детей Императора!"
 WrWrld_emperors_children.12.desc: "Конклав Феникса под руководством Эйдолона смог собрать Детей Императора воедино, теперь собранный единый легион отправится возвращать себе славу, либо погибнет!"
 WrWrld_emperors_children.12.a: "Вернём славу Детей Императора!"
 
 WrWrld_emperors_children.13.name: "Кража артефакта Гвардии Смерти"
 WrWrld_emperors_children.13.desc: "Гвардия Смерти обладает необходимым мне артефактом, все эти договорённости Абаддона меня мало волнуют."
 WrWrld_emperors_children.13.a: "Мне это нужнее."
 WrWrld_emperors_children.14.name: "Кража артефакта Гвардии Смерти"
 WrWrld_emperors_children.14.desc: "Мерзкий ублюдок Фабий Бал украл наш драгоценный артефакт! Это нельзя простить и оставить, Абаддон тому свидетель, не мы начинаем распри между легионами Хаоса!"
 WrWrld_emperors_children.14.a: "Вернём артефакт!"
 
 WrWrld_emperors_children.15.name: "Новые люди Фабия Байла"
 WrWrld_emperors_children.15.desc: "Считающиеся вершиной «искусства» Байла, эти существа обладают силой и интеллектом, превосходящими любого человека, а также худшими чертами человечества. Фабий расселяет Новых Людей по мирам Галактики, надеясь, что однажды они превзойдут человеческую расу. Фабий гордится своими Новыми Людьми, но также верит, что они должны убить его, чтобы исполнить своё предназначение, и он готов принять эту судьбу.\n\ В конце М37 Фабий Байл понял, что его Новым людям грозит угроза от нажитых им врагов, в отчаянии он согласился подчиниться Слаанеш, но его детям было позволено самим выбирать свою судьбу."
 WrWrld_emperors_children.15.a: "Гордость берёт за Новых людей!"
 
 WrWrld_emperors_children.100.name: "Слаанеш в материуме"
 WrWrld_emperors_children.100.desc: "Не нужно обманываться, мы всего лишь пешки неподвластной нам могущественной силы в лице Бога Хаоса. Наш Бог становится всё сильнее и его сила и влияние уже прорываются в материум с новой силой, мы буквально становимся "назначенными управленцами", в домене Бога который расположен в материуме. Вместе с ростом силы и влияния, материум как и имматериум, всё больше становится местом великой игры Богов. В знак признания наших заслуг, Бог позволит нам сохранить наши знамёна и сделать их символом домена в материуме."
 WrWrld_emperors_children.100.a: "Новая эра грядёт."
 WrWrld_emperors_children.100.b: "Мы ещё слишком слабы, чтобы перейти на этот новый уровень"
 
 WrWrld_alpha_legion.1.name: "Альфа легион и Альфарий"
 WrWrld_alpha_legion.1.desc: "Альфа Легионом управляет на данный момент некто, представляющийся Альфарием, через сеть заговоров и интриг он удерживает свою власть над Легионом."
 WrWrld_alpha_legion.1.a: "Гидра Доминатус!"
 
 WrWrld_alpha_legion.12.name: "Провокация война с Абаддоном!"
 WrWrld_alpha_legion.12.desc: "Мы сами не понимаем в полной мере, за, что мы сражаемся и против кого на самом деле. Но приказы поступают, мы их выполняем! Нужно совершить провокацию войны с Чёрным Легионом и его союзниками, нам дан выбор когда начать операцию, если ответа от Абаддона не последует, операцию тоже считать успешной."
 WrWrld_alpha_legion.12.a: "Начнём сейчас же!"
 WrWrld_alpha_legion.12.b: "Отложим на более подходящий момент..."
 WrWrld_alpha_legion.13.name: "Провокация Альфа Легиона!"
 WrWrld_alpha_legion.13.desc: "Альфа Легион устроил нападение на одно из наших как мы считали скрытых хранилищ!"
 WrWrld_alpha_legion.13.a: "Нужно нанести по ним удар!"
 WrWrld_alpha_legion.13.b: "Не будем участвовать в их игре, это явно какая-то ловушка"
 
 WrWrld_alpha_legion.35.name: "Плетущиеся интриги"
 WrWrld_alpha_legion.35.desc: "Неизвестно Альфарий или Псевдо-Альфарий сейчас возглавляет легион, но в Альфа легионе интриги не могут не плестись. Кто же сейчас побеждает в этих интригах?"
 WrWrld_alpha_legion.35.a: "Альфарий?"
 WrWrld_alpha_legion.35.b: "Зубы Змеи"
 WrWrld_alpha_legion.35.c: "Кернакс Волдориус"
 WrWrld_alpha_legion.35.d: "Сыны гидры"
 
 WrWrld_alpha_legion.36.name: "Плетущиеся интриги"
 WrWrld_alpha_legion.36.desc: "Предводитель Зубов Змеи, Соломон Акурра видит как вокруг него и его легиона плетутся интриги, некоторые из сообществ хотят сместить его. Кто же сейчас побеждает в этих интригах?"
 WrWrld_alpha_legion.36.a: "Зубы Змеи"
 WrWrld_alpha_legion.36.b: "Затенённые"
 WrWrld_alpha_legion.36.c: "Разумные существа"
 
 WrWrld_alpha_legion.37.name: "Охота на Кернакса Волдориуса"
 WrWrld_alpha_legion.37.desc: "Кернакс Волдориус был ответственен за гибель многих миллиардов, когда пробудил Кровавый Прилив в 034.М38. После активной борьбы против империума в последние годы, он стал преследуемым Мастерами Охоты ордена Белых Шрамов. Удастся ли ему уйти от погони? А если не удастся, то кто возглавит легион вместо него?"
 WrWrld_alpha_legion.37.a: "Кернакс Волдориус скрывается и продолжает войну!"
 WrWrld_alpha_legion.37.b: "Кинжалоклыки возглавят легион вместо убитого демон-принца Волдориуса"
 WrWrld_alpha_legion.37.c: "Кающиеся Сыновья возглавят легион вместо убитого демон-принца Волдориуса"
 
 WrWrld_alpha_legion.38.name: "Внутренний конфликт"
 WrWrld_alpha_legion.38.desc: "Кетцель Картах возглавляющий Сынов Гидры вступил в конфликт с Оккамом Ложным, кто из них победит в этом конфликте? Или же третья сила воспользуется их борьбой, чтобы объявить о своём воскрешении после казалось бы уничтожения на Враксе?"
 WrWrld_alpha_legion.38.a: "Сыны гидры и Кетцель Картах"
 WrWrld_alpha_legion.38.b: "Изменённые и Оккам Ложный"
 WrWrld_alpha_legion.38.c: "Неверующие воскреснут!"
 
 WrWrld_severan_events.10.name: "Гражданское общество"
 WrWrld_severan_events.10.desc: "Война с Империумом идёт не на равных. Северус заранее подготовил запасы, но даже с ними Империум нас превосходит, возможно нам нужно поощрять инициативу наших граждан, в войне за свободы и права, но самоорганизация общества может помешать планам Северуса, по созданию тоталитарной диктатуры."
 WrWrld_severan_events.10.a: "Поощрять гражданское общество."
 WrWrld_severan_events.10.b: "Власть решает - люди делают, самоорганизация лишь мешает."
 
 WrWrld_severan_events.11.name: "Деспотизм Северуса"
 WrWrld_severan_events.11.desc: "Северус никогда не собирался давать людям декларируемые им свободы и права, он осознанно использовал эту лживую уловку, чтобы заручиться поддержкой населения, а сам тайком выстраивал систему в которой будут его обожествлять, а страна будет жить при тоталитаризме. Возможно пришло время проявить своё растущее стремление к диктатуре и изменить само устройство государства."
 WrWrld_severan_events.11.a: "Принять попытку наделить Северуса большей властью."
 WrWrld_severan_events.11.b: "Не решится наделить Северуса большей властью..."
 
 WrWrld_severan_events.12.name: "Революция в Доминате"
 WrWrld_severan_events.12.desc: "Сформированное общество с выстроенными горизонтальными связями и пропитанное идеями борьбы за свободу, быстро поняло, что задумал Северус, в ходе прокатившихся конфликтов на всех планетах, власть Северуса была свергнута в каждом уголке домината. Провозглашена демократия."
 WrWrld_severan_events.12.a: "Да здравствует Республика!"
 
 WrWrld_severan_events.13.name: "Демократизация Домината"
 WrWrld_severan_events.13.desc: "Нерешительность Северуса и его некомпетентность, позволили сформироваться гражданскому обществу, которое стало требовать реализации озвучиваемых им лозунгов, ему ничего не остаётся кроме как пойти на уступки."
 WrWrld_severan_events.13.a: "Да здравствует Республика!"
 
 WrWrld_votann_events.10.name: "Господствующая лига"
 WrWrld_votann_events.10.desc: "В Лигах Вотанна есть разные лиги, на данный момент самой влиятельной является Великая Турийская Лига, но, что если за последние два с лишним десятилетия Турийская лига растеряла своё влияние и уже пора другой лиге на деле показать, что теперь здесь она самая влиятельная? Какая же лига на данный момент является самой влиятельной?"
 WrWrld_votann_events.10.a: "Великая Турийская Лига."
 WrWrld_votann_events.10.b: "Кронуская Гегемония."
 WrWrld_votann_events.10.c: "Транс-Гиперианский Альянс."
 WrWrld_votann_events.10.d: "Урани-Суртрские Регулы ."
 WrWrld_votann_events.10.e: "Ймырский Конгломерат."
 WrWrld_votann_events.10.f: "Промышленный Комплекс Гуло в союзе с Серан-Токской Торговой Лигой."
 
 WrWrld_votann_events.11.name: "Ситуация с Кинами"
 WrWrld_votann_events.11.desc: "Всё чаще нам попадаются торговые и прочие суда Кинов и всё чаще мы обнаруживаем их связь с Тау. По видимому Серан-Токская Торговая Лига известная нам как "Демиурги" и находящаяся в дружеских отношениях с Тау, смогла объединиться с Промышленным Комплексом Гуло, и они стали сильным союзом из двух ведущих Лиг, очевидно, что они готовят силы для атаки по нам, придётся нанести превентивный удар для защиты наших интересов."
 WrWrld_votann_events.11.a: "Мы также сможем ослабить научное развитие Тау."
 
 WrWrld_votann_events.12.name: "Ситуация с Империумом"
 WrWrld_votann_events.12.desc: "Наши территории достигли того момента, когда мы нуждаемся в расширении, Империум окружает нас со всех сторон, он ненавидит нас и не считает за людей, война с ним неизбежна, сейчас он лишь колосс на глиняных ногах и нету лучшего времени и возможности, чтобы нанести по нему удар."
 WrWrld_votann_events.12.a: "За Род!"
 
 WrWrld_votann_events.13.name: "Пробуждение Ядра Предков"
 WrWrld_votann_events.13.desc: "Вотанн пробуждение которого ждали Урани-Суртрские Регулы... Наконец-то пробудился!"
 WrWrld_votann_events.13.a: "Спасибо за дары твои!"
 
 WrWrld_aeldari_events.5.name: "Помощь Кворлам"
 WrWrld_aeldari_events.5.desc: "Империум не является нам другом, это враждебное государство убогой и примитивной расы, нас объединяет лишь обший враг в лице хаоса, хотя мы всё равно иногда вступаем в конфликт с Империумом. В сегментуме пацификус существует раса Кворлов, мы поддерживаем с ней нейтральные отношения, они могут выступить нашими прокси в противостоянии с Империумом, возможно пришло время оказать им поддержку в создании флота?"
 WrWrld_aeldari_events.5.a: "Отложим помощь на потом."
 WrWrld_aeldari_events.5.b: "Поможем Кворлам в создании флота."
 
 WrWrld_aeldari_events.6.name: "Помощь от Эльдар."
 WrWrld_aeldari_events.6.desc: "Эльдар решают помочь нам в противостоянии с Империумом. Мы рады их помощи и принимаем её, видимо сам факт нашего существования важен для них, что они готовы ничего не требовать взамен."
 WrWrld_aeldari_events.6.a: "Спасибо."
 WrWrld_aeldari_events.6.b: "Спасибо, можете ещё раз помочь через время?"
 
 children_of_thorns.5.name: "Преобразование детей шипов"
 children_of_thorns.5.desc: "Мы вели войну против угнетателей из Комморры, мы долго выживали, и то, что мы смогли продержаться так долго, уже говорит о том, что мы победим рано или поздно. Пора перейти на наших территориях к той модели общества, что мы хотим добиться, мы наконец-то готовы перестроить жизнь общества так, как мы это планировали."
 children_of_thorns.5.a: "Новая жизнь!"
 
 Commorragh_new_Archon.10.name: "Первая ошибка Векта?"
 Commorragh_new_Archon.10.desc: "Рутинные донесения, рутинная работа по стравливанию всех со всеми и поддержанию своего превосходства, но что если в этот раз Асдрубаэль Вект допустит свою первую ошибку?"
 Commorragh_new_Archon.10.a: "Асдрубаэль Вект не допускает ошибок."
 Commorragh_new_Archon.10.b: "Миг слабости ничего не разрушит."
 
 Commorragh_new_Archon.11.name: "Первая и последняя ошибка Векта"
 Commorragh_new_Archon.11.desc: "Миг слабости в Комморре стоит всего. Власть Асдрубаэля Векта стремительно рушится, все кабалы смогли объединиться против него, хотя и разделились на коалиции. Какая же коалиция сможет добиться большего?"
 Commorragh_new_Archon.11.a: "Гаснущее солнце, Железный шип, Ядовитый язык."
 Commorragh_new_Archon.11.b: "Освежёванный Череп, Обсидиановая Роза, Сломанная Печать"
 Commorragh_new_Archon.11.c: "Предсмертная Ненависть, Отсечённые, Пророки Плоти"
 
 Commorragh_new_Archon.12.name: "Грызня в победившей коалиции"
 Commorragh_new_Archon.12.desc: "Месяц(Терранский) вся Комморра была охвачена пламенем гражданской войны, победившая коалиция определилась, но в её среде уже начался новый конфликт за власть, кто же выйдет победителем?"
 Commorragh_new_Archon.12.a: "Гаснущее солнце"
 Commorragh_new_Archon.12.b: "Железный шип"
 Commorragh_new_Archon.12.c: "Ядовитый язык"
 
