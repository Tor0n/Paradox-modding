l_russian:
 WrWrld_game_start.0.name:0 "Перед началом игры.."
 WrWrld_game_start.0.desc:0 "Здравствуй игрок!\n\ В первые пять игровых дней будет происходить активация скриптов, это вызовет лаги и замедления производительности, но затем всё пройдёт и можно будет спокойно играть дальше. Мод работает очевидно не так быстро как обычная игра, но обычно по мере продолжения вечной войны, игра начинает работать быстрее. Я также постарался не нагружать мод большим числом новых лишних расчётов.\n\ Данный ивент я планирую в будущем использовать для настройки мода игроком при старте и возможно сообщать некоторые детали нового обновления, поэтому не пролистывай ивент, а читай на всякий случай после каждого обновления.\n\ Обратите также внимание, если у вас есть пустые системы на карте и появились страны как в обычной игре и их очевидно быть не должно, скорее всего у вас не хватает какого-то необходимого длс для мода, вы конечно можете продолжить играть так, но если вам очень не нравится эта проблема, то вы можете самостоятельно изменить файлы стран в моде, зачастую замены гражданских моделей и портретов, достаточно, чтобы отвязать мод от проблемных для вас длс.\n\ Также желательно повысить стоимость научных исследований и принятия традиций."
 WrWrld_game_start.0.a:0 "О моде, багах и условностях."
 WrWrld_game_start.0.b:0 "Настройка (в разработке)."
 WrWrld_game_start.0.c:0 "Понятно."
 
 WrWrld_game_start.1.name:0 "О моде, багах и условностях."
 WrWrld_game_start.1.desc:0 "Изначально это не планировалось модом про вархаммер, но по итогу я постарался объединить труд множества мододелов до меня про вархаммер, для того, чтобы в будущем вы могли это использовать как отправную точку для создания уже своей новой версии вархаммер мода.\n\ На данный момент я думаю стоит уточнить такое обстоятельство, что мод всё ещё в разработке и над модом работаю я в одиночку, это огромный труд требующий много времени и я банально не могу здесь сделать всё сам в одиночку, поэтому не стоит например мне говорить про сломавшиеся картинки городов, я знаю, но у меня есть много более важных задач, что непосредственно влияют на геймплей. Не стоит ждать, что я починю города например, лучше сделайте это сами, загрузите свой сабмод в мастерскую и дайте на него ссылку в комментариях к нашему моду, я тогда смогу интегрировать ваши исправления, в основной мод.\n\ Я поработал над архитектурой файлов и пробую написать некоторую инструкцию к моду, чтобы вам было проще разобраться как его обновлять в случае моей смерти или как делать на него сабмоды.\n\ В моде на данный момент есть баг который я не знаю как исправить, возможно иногда вы видите пустую систему которая где-то появляется, это как раз и есть данный баг, если он сильно портит внешний вид отображения стран, лучше перезапустить игру, либо просто отнестись с терпением.\n\ Также в моде присутствует очень большое число условностей, например некоторые династии некронов объединены в одну, а от сегментума ультимы отделены 2 государства, чтобы игроку было проще контроллировать и так большую территорию. Я также например посчитал, что экзодиты будут интереснее как развитая фракция изоляционистов, а не как просто миры примитивных цивилизаций у которых в этом суровом мире просто нет шанса выжить."
 WrWrld_game_start.1.a:0 "Вернуться к стартовому ивенту."
 
 black_crusades.name: "Чёрный Крестовый Поход"
 black_crusades.desc: "Долгая война идёт и понемногу чаша весов склоняется в нашу сторону, пришло время нанести новый удар по Империуму! Время отложить распри и в едином порыве ударить по всем фронтам!"
 black_crusades.a: "Боги дают нам ресурсы из варпа, но и мы достанем свои накопления."
 black_crusades.b: "Мы подумаем об этом предложение... А хотя нет... Определенно начнем!"
 black_crusades_imp.desc: "Абаддон начал новый Чёрный Крестовый Поход против нас, он смог снова объединить всех хаоситов и на время прекратить войны между ними, также боги хаоса дадут им новые ресурсы на войну с нами."
 black_crusades_imp.a: "Приготовиться защищаться!"
 
 Grear_rift_summon.name: "Великий разлом"
 Grear_rift_summon.desc: "Мы долго готовились к столь сложному колдовству, но теперь мы готовы создать мощнейший варп-шторм, чтобы разорвать империум на две части!"
 Grear_rift_summon.a: "Приступим."

