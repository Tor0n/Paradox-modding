l_russian:
 building_cult_imperor_temple: "Собор Культа Императора"
 building_cult_imperor_temple_desc: "Главное здания Епархии, управляемое кардиналом. Именно через него транслируется воля Экклезиарха."
 building_inquisition branch: "Отеделние инквизиции"
 building_inquisition branch_desc: "Место для собрания сторожевых псов Экклезиархии - иквизиторов. Выявлять и уничтожать мириады потенциальных угроз человечеству - вот главная задача этого места."
 building_convents_sororitas: "Монастырь Сороритас"
 building_convents_sororitas_desc: "Место проживания и службы Сестер Битвы. Эти монастыри обеспечат безопасность в любой точке галактики."
 building_convents_hospitaller: "Монастырь Госпитальер"
 building_convents_hospitaller_desc: "Эти монастыри принимают форму больниц и приютов, они созданны для исцеления и предоставления медицинской помощи всем гражданам Империума."
