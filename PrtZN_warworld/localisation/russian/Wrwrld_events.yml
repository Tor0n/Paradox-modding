 WrWrld_game_start.0.name:0 "Перед началом игры.."
 WrWrld_game_start.0.desc:0 "Здравствуй игрок!\n\В первые пять игровых дней будет происходить активация скриптов, это вызовет лаги и замедления производительности, но затем всё пройдёт и можно будет спокойно играть дальше. Мод работает очевидно не так быстро как обычная игра, но обычно по мере продолжения вечной войны, игра начинает работать всё быстрее и быстрее, в ходе моих тестов обычно ускоряется на примерно 30% за 60 лет игры. Я также постарался не нагружать мод большим числом новых лишних расчётов.\n\Данный ивент я планирую в будущем использовать для настройки мода игроком при старте и возможно сообщать некоторые детали нового обновления, поэтому не пролистывай ивент, а читай на всякий случай после каждого обновления.\n\На данный момент я думаю стоит уточнить такое обстоятельство, что над модом работаю я в одиночку, это огромный труд требующий много времени и я банально не могу здесь сделать всё сам в одиночку, поэтому не стоит например мне говорить про сломавшиеся картинки городов, я знаю, но у меня есть много более важных задач, что непосредственно влияют на геймплей. Не стоит ждать, что я починю города например, лучше сделайте это сами, загрузите свой сабмод в мастерскую и дайте на него ссылку в комментариях к нашему моду, я тогда смогу интегрировать ваши исправления, в основной мод.\n\Я поработал над архитектурой файлов и пробую написать некоторую инструкцию к моду, чтобы вам было проще разобраться как его обновлять в случае моей смерти или как делать на него сабмоды.\n\В моде на данный момент есть баг который я не знаю как исправить, возможно иногда вы видите пустую систему которая где-то появляется, это как раз и есть данный баг, если он сильно портит внешний вид отображения стран, лучше перезапустить игру, либо просто отнестись с терпением.\n\Обратите также внимание, если у вас есть пустые системы на карте и появились страны как в обычной игре и их очевидно быть не должно, скорее всего у вас не хватает какого-то необходимого длс для мода, вы конечно можете продолжить играть так, но если вам очень не нравится эта проблема, то вы можете самостоятельно изменить файлы стран в моде, зачастую замены гражданских моделей и портретов, достаточно, чтобы отвязать мод от проблемных для вас длс."
 WrWrld_game_start.0.a:0 "Понятно."

