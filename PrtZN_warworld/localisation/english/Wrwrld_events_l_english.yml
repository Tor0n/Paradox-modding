l_english:
 WrWrld_game_start.0.name: "Before the game starts.."
 WrWrld_game_start.0.desc: "Hello player!\n\ In the first five days of the game, scripts will be activated, this will cause lags and slowdowns in performance, but then everything will pass and you can safely continue playing. The mod obviously doesn't run as fast as a regular game, but usually as the eternal war continues, the game starts to run faster. I also tried not to burden the mod with a large number of new unnecessary calculations.\n\ I plan to use this event in the future to customize the mod by the player at the start and possibly provide some details of the new update, so do not scroll through the event, but read it just in case after each update.\n\ Please also note that if you have empty systems on the map and countries appear as in a normal game and they obviously shouldn't be there, most likely you don't have enough of some necessary DLC for the mod, of course you can continue playing like this, but if you really don't like this problem, then you can independently change the files of the countries in fashion, often replacing civilian models and portraits is enough to detach the mod from problematic dls for you.\n\ It is also desirable to increase the cost of scientific research and acceptance of traditions."
 WrWrld_game_start.0.a: "About mod, bugs, and conventions."
 WrWrld_game_start.0.b: "Setup (under development)."
 WrWrld_game_start.0.c: "Go to settings."
 
 WrWrld_game_start.1.name: "About mod, bugs, and conventions."
 WrWrld_game_start.1.desc: "Initially, this was not planned by the warhammer mod, but as a result, I tried to combine the work of many modelers before me about warhammer, so that in the future you can use this as a starting point to create your own new version of the warhammer mod.\n\ At the moment, I think it's worth clarifying the fact that the mod is still in development and I'm working on the mod alone, it's a lot of time-consuming work and I simply can't do everything here on my own, so don't, for example, tell me about broken pictures of cities, I know, but I have There are many more important tasks that directly affect the gameplay. Don't expect me to fix cities, for example, it's better to do it yourself, upload your submod to the workshop and give it a link in the comments to our mod, then I can integrate your fixes into the main mod.I've been working on the architecture of the files and I'm trying to write some instructions for the mod so that it's easier for you to figure out how to update it in the event of my death or how to make submodes on it.\n\ There is a bug in fashion at the moment that I do not know how to fix, perhaps sometimes you see an empty system that appears somewhere, this is exactly this bug, if it greatly spoils the appearance of the display of countries, it is better to restart the game, or just be patient.There are also a very large number of conventions in the mod, for example, some necron dynasties are united into one, and 2 states are separated from the Ultima segmentum to make it easier for the player to control an already large territory. For example, I also thought that exodites would be more interesting as a developed faction of isolationists, rather than as just worlds of primitive civilizations that simply have no chance of surviving in this harsh world.."
 WrWrld_game_start.1.a: "Go back to the start event."
 
 WrWrld_game_start.11.name: "Determining the Development of Events and the World"
 WrWrld_game_start.11.desc: "The mod provides a choice of three options that will determine which events can occur.\n\ Canon will force the world to develop according to the events that occurred in canon. For example, the mod allows for the replacement of the Chaos Legions with others, but in "canon" this will not happen. The Thousand Sons will remain under the leadership of Magnus and the Great Rift will occur. The Phoenix Conclave will definitely become the Emperor's Children, eliminating other possible developments.\n\ Canon Plus will preserve the canon development of events, but will include further developments of canon as I see it. For example, some of the Necrons will be able to transfer themselves into biological bodies, as they wish (not yet done), and some of the Chaosites, in the event of great success, will transform into the Domain of their Gods in the material world.\n\ Free choice will open up opportunities to change the leadership of their countries, for example, in Commorra will replace Asdrubael Vect and his Kabal with another Kabal. In the Wotan Leagues, for example, it will also be possible to change the dominant force.
 WrWrld_game_start.11.a: "Canon Plus"
 WrWrld_game_start.11.b: "Canon"
 WrWrld_game_start.11.c: "Free Choice"

 WrWrld_game_start.12.name: "Warp Storms"
 WrWrld_game_start.12.desc: "Enable warp storms on the map, which will be displayed through created nebulae?"
 WrWrld_game_start.12.a: "No Nebulae"
 WrWrld_game_start.12.b: "Enable Nebulae"
 
 black_crusades.name: "The Black Crusade"
 black_crusades.desc: "A long war is underway and the scales are gradually tipping in our direction, it's time to strike a new blow at the Imperium! It's time to put aside the strife and strike on all fronts in unison!"
 black_crusades.a: "The gods give us resources from the warp, but we'll get our own savings."
 black_crusades.b: "We will think about this proposal... But even though it's not... Definitely let's get started!"
 black_crusades_imp.desc: "Abaddon has begun a new Black Crusade against us. He has once again managed to unite all the forces of Chaos and temporarily halt the wars between them. The Chaos gods will also grant them new resources for the war against us."
 black_crusades_imp.a: "Prepare to defend ourselves!"
 
 Grear_rift_summon.name: "The Great Rift"
 Grear_rift_summon.desc: "We have long prepared for such complex sorcery, but now we are ready to create a powerful warp storm to tear the Imperium in two!"
 Grear_rift_summon.a: "Let's begin."
 
 WrWrld_death_guard.31.name: "Nurgle's Wrath"
 WrWrld_death_guard.31.desc: "Nurgle is enraged that we are not waging a successful war in his name. He will remove Mortarion in the hope that new leadership for the Death Guard will be able to wage war better."
 WrWrld_death_guard.31.a: "Freedom"
 
 WrWrld_death_guard.32.name: "Replacing Mortarion"
 WrWrld_death_guard.32.desc: "Nurgle has decided to get rid of the incompetent Mortarion and replace him with someone new. Who will he choose?"
 WrWrld_death_guard.32.a: "Guard members proposing a different approach"
 WrWrld_death_guard.32.b: "The Guard only needs to replace Mortarion, leaving everything else as is"
 WrWrld_death_guard.32.c: "Only a complete replacement of the Guard with someone else can help"
 
 WrWrld_death_guard.33.name: "New Approach for the Guard"
 WrWrld_death_guard.33.desc: "Who will lead the Death Guard?"
 WrWrld_death_guard.33.a: "Typhus"
 WrWrld_death_guard.33.b: "Pox Scar"
 WrWrld_death_guard.33.c: "Favorite Sons"
 WrWrld_death_guard.33.d: "Brotherhood of Rot"
 WrWrld_death_guard.33.e: "Apostles of Contagion under Necrosius's rule"
 WrWrld_death_guard.33.f: "The Prolific"
 WrWrld_death_guard.33.g: "Weeping Legion"
 
 WrWrld_death_guard.34.name: "New Leaders of the Guard"
 WrWrld_death_guard.34.desc: "Who will lead the Death Guard?"
 WrWrld_death_guard.34.a: "Lords of Silence"
 WrWrld_death_guard.34.b: "The Corrupted"
 WrWrld_death_guard.34.c: "Pale Hand"
 WrWrld_death_guard.34.d: "Rot Choir"
 WrWrld_death_guard.34.e: "Crafters of Corpses"
 WrWrld_death_guard.34.f: "Scavenger Hounds"
 
 WrWrld_death_guard.35.name: "Replacing the Death Guard"
 WrWrld_death_guard.35.desc: "Who will replace the Death Guard?"
 WrWrld_death_guard.35.a: "The Purge"
 WrWrld_death_guard.35.b: "The Splintered"
 WrWrld_death_guard.35.c: "Lords of Decay"
 WrWrld_death_guard.35.d: "Children of Blain"
 
 WrWrld_death_guard.36.name: "An Unexpected Truce with the Death Guard?!"
 WrWrld_death_guard.36.desc: "As our intelligence reports, something has happened in the Death Guard and it seems Mortarion is no more... The new force that replaced him has decided to temporarily halt attacks on us, focusing on xenos instead. Given our situation, it's better to take advantage of this respite."
 WrWrld_death_guard.36.a: "Unexpected!"
 WrWrld_death_guard.37.name: "The Imperium's Turn..."
 WrWrld_death_guard.37.desc: "We have brought enough gifts of Nurgle to the xenos. We have strengthened our position and it's time to try to take on the Imperium again!"
 WrWrld_death_guard.37.a: "War!"
 
 WrWrld_death_guard.38.name: "Defeat of Agri-Worlds"
 WrWrld_death_guard.38.desc: "Reports are coming in from all corners of the defeat of agri-worlds and all food production. There is no doubt that this is the work of Nurgle's agents. This is a new threat that the Imperium has never faced before; its resolution will take many years, and an unimaginable number of human resources will be lost."
 WrWrld_death_guard.38.a: "Emperor, give us the strength to endure this"
 WrWrld_death_guard.39.name: "Defeat of the Imperium's Agri-Worlds"
 WrWrld_death_guard.39.desc: "By concentrating all our forces on our task of undermining the Imperium's agri-worlds, we have managed to create new types of epidemics perfectly suited for agri-worlds and capable of spreading between them on their own. An estimated 20% reduction in productivity will soon engulf the entire Imperium thanks to the planted pathogens."
 WrWrld_death_guard.39.a: "Hundreds of billions will die and hundreds of billions will be sick!"
 
 WrWrld_death_guard.40.name: "Treaty with the Death Guard"
 WrWrld_death_guard.40.desc: "The Death Guard wishes to improve relations with us. This will be mutually beneficial cooperation."
 WrWrld_death_guard.40.a: "Good"
 WrWrld_death_guard.41.name: "Treaty with the Mechanicum"
 WrWrld_death_guard.41.desc: "We desire to possess a greater number of various types of machinery. Let us help the Mechanicum, and they will help us in return."
 WrWrld_death_guard.41.a: "Symbiosis"
 WrWrld_death_guard.42.name: "Death Guard Raid"
 WrWrld_death_guard.42.desc: "The Death Guard has raided our transport fleets in space"
 WrWrld_death_guard.42.a: "We will have our revenge"
 
 WrWrld_death_guard.100.name: "Nurgle in Materium"
 WrWrld_death_guard.100.desc: "Let's not deceive ourselves, we are merely pawns of a mighty force beyond our control in the form of the Chaos God. Our God is growing ever stronger and his power and influence are already breaking into the materium with renewed force. We are literally becoming the 'appointed managers' in the God's domain located in the materium. Along with the growth of power and influence, the materium, like the immaterium, is increasingly becoming a place for the Great Game of the Gods. In recognition of our merits, the God will allow us to keep our banners and make them the symbol of the domain in the materium."
 WrWrld_death_guard.100.a: "A new era is coming."
 WrWrld_death_guard.100.b: "We are still too weak to move to this new level"
 
 WrWrld_world_eaters.20.name: "Khorne's Wrath"
 WrWrld_world_eaters.20.desc: "Khorne is enraged that we are not waging a successful war in his name. He will remove Angron in the hope that new leadership for the World Eaters will be able to wage war better."
 WrWrld_world_eaters.20.a: "Freedom"
 WrWrld_world_eaters.21.name: "Change of Leadership for the World Eaters"
 WrWrld_world_eaters.21.desc: "Khorne kills Angron who was not sufficiently successful in waging war. The new leader of the World Eaters will be?"
 WrWrld_world_eaters.21.a: "Kharn and his Meat Horde"
 WrWrld_world_eaters.21.b: "Skulltaker U'Zhul and his Skullsworn"
 WrWrld_world_eaters.21.c: "Kossolax and his Exiles"
 WrWrld_world_eaters.21.d: "What if a lesser force with a new approach?"
 
 WrWrld_world_eaters.22.name: "New Approach"
 WrWrld_world_eaters.22.desc: "In hopes of rectifying the situation, Khorne will allow a now lesser force to take the lead of the remnants of the Legion. Whom will Khorne support?"
 WrWrld_world_eaters.22.a: "Gladiatorial Squad 331"
 WrWrld_world_eaters.22.b: "Fire Riders in alliance with Void Butchers"
 WrWrld_world_eaters.22.c: "Impudent Butchers"
 WrWrld_world_eaters.22.d: "Bloodthirsty Blood-Drinkers"
 WrWrld_world_eaters.22.e: "Canos Devoratores"
 
 WrWrld_world_eaters.23.name: "Disappointment Again"
 WrWrld_world_eaters.23.desc: "Kharn also proved unsuccessful. Khorne will allow him to be replaced by one of the two strong warbands in his host."
 WrWrld_world_eaters.23.a: "Life Killers."
 WrWrld_world_eaters.23.b: "Angron's Fury."
 
 WrWrld_world_eaters.24.name: "Change of Leaders"
 WrWrld_world_eaters.24.desc: "Over the past decades, many different followers of Khorne have flocked to our territory. Perhaps someone already surpasses us and others in their influence. Who is currently the most influential in this region?"
 WrWrld_world_eaters.24.a: "Bloody Slaughter."
 WrWrld_world_eaters.24.b: "Skulltaker U'Zhul and his Skullsworn."
 WrWrld_world_eaters.24.c: "Skull Collectors."
 WrWrld_world_eaters.24.d: "The Consecrated."
 WrWrld_world_eaters.24.e: "Canos Devoratores."
 WrWrld_world_eaters.24.f: "Impudent Butchers."
 WrWrld_world_eaters.24.g: "Fire Riders in alliance with Void Butchers."
 
 WrWrld_world_eaters.100.name: "Khorne in Materium"
 WrWrld_world_eaters.100.desc: "Let's not deceive ourselves, we are merely pawns of a mighty force beyond our control in the form of the Chaos God. Our God is growing ever stronger and his power and influence are already breaking into the materium with renewed force. We are literally becoming the 'appointed managers' in the God's domain located in the materium. Along with the growth of power and influence, the materium, like the immaterium, is increasingly becoming a place for the Great Game of the Gods. In recognition of our merits, the God will allow us to keep our banners and make them the symbol of the domain in the materium."
 WrWrld_world_eaters.100.a: "A new era is coming."
 WrWrld_world_eaters.100.b: "We are still too weak to move to this new level"
 
 WrWrld_thousand_sons.5.name: "Ahriman and his Scheming"
 WrWrld_thousand_sons.5.desc: "Information has reached us that relatively soon, Ahriman is preparing to perform a second rubric."
 WrWrld_thousand_sons.5.a: "We need to act!"
 
 WrWrld_thousand_sons.7.name: "The Second Rubric"
 WrWrld_thousand_sons.7.desc: "Ahriman performs the second rubric (having already returned from the future to prevent the rise of Pyrodomon) with the aim of resurrecting the legion and is even willing to sacrifice his own life."
 WrWrld_thousand_sons.7.a: "Knekku intervenes in the ritual to restore Magnus's shattered mind!"
 WrWrld_thousand_sons.7.b: "Ahriman performs the rubric, albeit without success, but he defends against interference!"
 WrWrld_thousand_sons.7.c: "Third forces intervene!"
 
 WrWrld_thousand_sons.8.name: "Intervention by Third Forces"
 WrWrld_thousand_sons.8.desc: "What began to happen is impossible to describe. Who did it and why is unclear, but in the ensuing turmoil, a new contender for the leadership of the Thousand Sons has emerged."
 WrWrld_thousand_sons.8.a: "Someone from Ahriman's people decided to betray him and take his place."
 WrWrld_thousand_sons.8.b: "Someone from Magnus's people decided to betray him and take his place."
 WrWrld_thousand_sons.8.c: "Someone acting on their own saw this as their chance."
 
 WrWrld_thousand_sons.9.name: "Seizure of Power"
 WrWrld_thousand_sons.9.desc: "Who managed to seize power in the end?"
 WrWrld_thousand_sons.9.a: "Silver Sons"
 WrWrld_thousand_sons.9.b: "Crimson Sons"
 WrWrld_thousand_sons.9.c: "Great Order of Hermetic Blades"
 WrWrld_thousand_sons.9.d: "Warp Ghosts"
 
 WrWrld_thousand_sons.10.name: "Seizure of Power"
 WrWrld_thousand_sons.10.desc: "Who managed to seize power in the end?"
 WrWrld_thousand_sons.10.a: "Prosperine Sect"
 WrWrld_thousand_sons.10.b: "Red Echo"
 WrWrld_thousand_sons.10.c: "Prism of Fate"
 WrWrld_thousand_sons.10.d: "Tizcan Host"
 WrWrld_thousand_sons.10.e: "Slaves of Magnus"
 
 WrWrld_thousand_sons.11.name: "Seizure of Power"
 WrWrld_thousand_sons.11.desc: "Who managed to seize power in the end?"
 WrWrld_thousand_sons.11.a: "The Tormented"
 WrWrld_thousand_sons.11.b: "Sons of the Cyclops"
 WrWrld_thousand_sons.11.c: "Crystal Harbingers"
 WrWrld_thousand_sons.11.d: "The Reflected"
 
 WrWrld_thousand_sons.20.name: "The Great Rift"
 WrWrld_thousand_sons.20.desc: "We have long prepared for such complex sorcery, but now we are ready to create a powerful warp storm to tear the Imperium in two!"
 WrWrld_thousand_sons.20.a: "Let's begin."

 WrWrld_thousand_sons.21.name: "The Great Rift"
 WrWrld_thousand_sons.21.desc: "We are receiving messages that are difficult to even comprehend. But everything points to the greatest catastrophe in the galaxy. The galaxy is now torn in two by the most massive warp storm in recorded history. Travel through it is almost impossible, but some stable passages remain."
 WrWrld_thousand_sons.21.a: "I can't believe this could be true."
 
 WrWrld_thousand_sons.22.name: "Kingdom of Sorcerers"
 WrWrld_thousand_sons.22.desc: "With the beginning of the new millennium seeing a rise in the number of psykers, Magnus seeks to create a safe home for them - his own kingdom, where they will be protected from Imperial persecution."
 WrWrld_thousand_sons.22.a: "Everyone will benefit from this."
 
 WrWrld_thousand_sons.100.name: "Tzeentch in Materium"
 WrWrld_thousand_sons.100.desc: "Let's not deceive ourselves, we are merely pawns of a mighty force beyond our control in the form of the Chaos God. Our God is growing ever stronger and his power and influence are already breaking into the materium with renewed force. We are literally becoming the 'appointed managers' in the God's domain located in the materium. Along with the growth of power and influence, the materium, like the immaterium, is increasingly becoming a place for the Great Game of the Gods. In recognition of our merits, the God will allow us to keep our banners and make them the symbol of the domain in the materium."
 WrWrld_thousand_sons.100.a: "A new era is coming."
 WrWrld_thousand_sons.100.b: "We are still too weak to move to this new level"
 
 WrWrld_emperors_children.10.name: "Phoenix Conclave and the Emperor's Children"
 WrWrld_emperors_children.10.desc: "After the defeat at Terra during the Horus Heresy, the Emperor's Children legion retreated to the Eye of Terror and waged wars there for slaves against other Chaos legions. Fulgrim increasingly distanced himself from managing the legion, and as a result, the Emperor's Children legion degraded and fragmented into many warbands. The Phoenix Conclave under the leadership of Eidolon aims to reunite the Emperor's Children legion and restore its former glory."
 WrWrld_emperors_children.10.a: "Let's return glory to the Emperor's Children!"
 
 WrWrld_emperors_children.11.name: "Dominant Faction"
 WrWrld_emperors_children.11.desc: "Among the scattered remnants of the Emperor's Children, the Phoenix Conclave is currently the most influential. But what if, over the past two decades, the Phoenix Conclave has lost its influence and it's time for another faction to take the leading position among Slaaneshi Space Marines?"
 WrWrld_emperors_children.11.a: "The Phoenix Conclave will continue its path!"
 WrWrld_emperors_children.11.b: "Fabius Bile's Consortium will create new men!"
 WrWrld_emperors_children.11.c: "The Flawless Host of Lucius will lead a self-satisfying campaign of violence!"
 WrWrld_emperors_children.11.d: "The Perfect Host will sit at the right hand of Slaanesh!"
 WrWrld_emperors_children.11.e: "Constrictus will 'Create'!"
 WrWrld_emperors_children.11.f: "The Funeral Choir will create harmony through destabilization!"
 
 WrWrld_emperors_children.12.name: "Rebirth of the Emperor's Children!"
 WrWrld_emperors_children.12.desc: "The Phoenix Conclave under Eidolon's leadership managed to reunite the Emperor's Children. Now the gathered unified legion will set out to reclaim its glory or perish!"
 WrWrld_emperors_children.12.a: "Let's return glory to the Emperor's Children!"
 
 WrWrld_emperors_children.13.name: "Theft of a Death Guard Artifact"
 WrWrld_emperors_children.13.desc: "The Death Guard possesses an artifact I need. All these agreements with Abaddon concern me little."
 WrWrld_emperors_children.13.a: "I need it more."
 WrWrld_emperors_children.14.name: "Theft of a Death Guard Artifact"
 WrWrld_emperors_children.14.desc: "The vile bastard Fabius Bile has stolen our precious artifact! This cannot be forgiven or left unaddressed. Abaddon is a witness; it's not us starting strife between the Chaos legions!"
 WrWrld_emperors_children.14.a: "Let's retrieve the artifact!"
 
 WrWrld_emperors_children.15.name: "Fabius Bile's New Men"
 WrWrld_emperors_children.15.desc: "Considered the pinnacle of Bile's 'art', these beings possess strength and intellect surpassing any human, as well as the worst traits of humanity. Fabius settles the New Men across the worlds of the Galaxy, hoping that one day they will surpass the human race. Fabius is proud of his New Men but also believes they must kill him to fulfill their purpose, and he is ready to accept this fate.\n\ At the end of M37, Fabius Bile realized that his New Men were threatened by the enemies he had made. In desperation, he agreed to submit to Slaanesh, but his children were allowed to choose their own fate."
 WrWrld_emperors_children.15.a: "Pride for the New Men!"
 
 WrWrld_emperors_children.100.name: "Slaanesh in Materium"
 WrWrld_emperors_children.100.desc: "Let's not deceive ourselves, we are merely pawns of a mighty force beyond our control in the form of the Chaos God. Our God is growing ever stronger and his power and influence are already breaking into the materium with renewed force. We are literally becoming the 'appointed managers' in the God's domain located in the materium. Along with the growth of power and influence, the materium, like the immaterium, is increasingly becoming a place for the Great Game of the Gods. In recognition of our merits, the God will allow us to keep our banners and make them the symbol of the domain in the materium."
 WrWrld_emperors_children.100.a: "A new era is coming."
 WrWrld_emperors_children.100.b: "We are still too weak to move to this new level"
 
 WrWrld_alpha_legion.1.name: "Alpha Legion and Alpharius"
 WrWrld_alpha_legion.1.desc: "The Alpha Legion is currently ruled by someone presenting himself as Alpharius, who maintains his power over the Legion through a web of conspiracies and intrigues."
 WrWrld_alpha_legion.1.a: "Hydra Dominatus!"
 
 WrWrld_alpha_legion.12.name: "Provocation of War with Abaddon!"
 WrWrld_alpha_legion.12.desc: "We ourselves do not fully understand what we are fighting for and who we are truly fighting against. But orders come, and we carry them out! We need to provoke a war with the Black Legion and its allies. We are given a choice of when to start the operation. If there is no response from Abaddon, the operation is also considered a success."
 WrWrld_alpha_legion.12.a: "Let's start right now!"
 WrWrld_alpha_legion.12.b: "Postpone for a more suitable moment..."
 WrWrld_alpha_legion.13.name: "Alpha Legion Provocation!"
 WrWrld_alpha_legion.13.desc: "The Alpha Legion has staged an attack on one of our supposedly hidden caches!"
 WrWrld_alpha_legion.13.a: "We need to strike back at them!"
 WrWrld_alpha_legion.13.b: "Let's not play their game; this is clearly some kind of trap."
 
 WrWrld_alpha_legion.35.name: "Weaving Intrigues"
 WrWrld_alpha_legion.35.desc: "It is unknown whether Alpharius or Pseudo-Alpharius currently leads the legion, but in the Alpha Legion, intrigues are always being woven. Who is currently winning in these intrigues?"
 WrWrld_alpha_legion.35.a: "Alpharius?"
 WrWrld_alpha_legion.35.b: "Fangs of the Serpent"
 WrWrld_alpha_legion.35.c: "Kernax Voldorius"
 WrWrld_alpha_legion.35.d: "Sons of the Hydra"
 
 WrWrld_alpha_legion.36.name: "Weaving Intrigues"
 WrWrld_alpha_legion.36.desc: "The leader of the Fangs of the Serpent, Solomon Akurra, sees how intrigues are being woven around him and his legion. Some communities want to overthrow him. Who is currently winning in these intrigues?"
 WrWrld_alpha_legion.36.a: "Fangs of the Serpent"
 WrWrld_alpha_legion.36.b: "The Shaded"
 WrWrld_alpha_legion.36.c: "Sentient Beings"
 
 WrWrld_alpha_legion.37.name: "Hunt for Kernax Voldorius"
 WrWrld_alpha_legion.37.desc: "Kernax Voldorius was responsible for the death of many billions when he unleashed the Blood Tide in 034.M38. After actively fighting against the Imperium in recent years, he has become hunted by the Masters of the Hunt of the White Scars chapter. Will he manage to escape the pursuit? And if not, who will lead the legion in his place?"
 WrWrld_alpha_legion.37.a: "Kernax Voldorius hides and continues the war!"
 WrWrld_alpha_legion.37.b: "Dagger-Fangs will lead the legion in place of the slain Daemon Prince Voldorius"
 WrWrld_alpha_legion.37.c: "Penitent Sons will lead the legion in place of the slain Daemon Prince Voldorius"
 
 WrWrld_alpha_legion.38.name: "Internal Conflict"
 WrWrld_alpha_legion.38.desc: "Ketzeel Kartakh, leading the Sons of the Hydra, has entered into conflict with Occam the False. Who will win in this conflict? Or will a third force take advantage of their struggle to announce its resurrection after seemingly being destroyed on Vraks?"
 WrWrld_alpha_legion.38.a: "Sons of the Hydra and Ketzeel Kartakh"
 WrWrld_alpha_legion.38.b: "The Altered and Occam the False"
 WrWrld_alpha_legion.38.c: "The Unbelievers will rise again!"
 
 WrWrld_severan_events.10.name: "Civil Society"
 WrWrld_severan_events.10.desc: "The war with the Imperium is not an equal fight. Severan prepared reserves in advance, but even with them, the Imperium surpasses us. Perhaps we need to encourage the initiative of our citizens in the war for freedoms and rights. But self-organization of society could interfere with Severan's plans to create a totalitarian dictatorship."
 WrWrld_severan_events.10.a: "Encourage civil society."
 WrWrld_severan_events.10.b: "The power decides - the people act, self-organization only hinders."
 
 WrWrld_severan_events.11.name: "Severan's Despotism"
 WrWrld_severan_events.11.desc: "Severan never intended to give people the freedoms and rights he proclaimed. He consciously used this deceitful trick to gain popular support while secretly building a system in which he would be deified and the country would live under totalitarianism. Perhaps the time has come to manifest his growing aspiration for dictatorship and change the very structure of the state."
 WrWrld_severan_events.11.a: "Accept the attempt to grant Severan greater power."
 WrWrld_severan_events.11.b: "Not dare to grant Severan greater power..."
 
 WrWrld_severan_events.12.name: "Revolution in the Dominate"
 WrWrld_severan_events.12.desc: "The formed society with built horizontal connections and imbued with ideas of struggle for freedom quickly understood what Severan was planning. In the course of conflicts that swept across all planets, Severan's power was overthrown in every corner of the Dominate. Democracy is proclaimed."
 WrWrld_severan_events.12.a: "Long live the Republic!"
 
 WrWrld_severan_events.13.name: "Democratization of the Dominate"
 WrWrld_severan_events.13.desc: "Severan's indecisiveness and incompetence allowed a civil society to form, which began to demand the implementation of the slogans he voiced. He has no choice but to make concessions."
 WrWrld_severan_events.13.a: "Long live the Republic!"
 
 WrWrld_votann_events.10.name: "Dominant League"
 WrWrld_votann_events.10.desc: "There are different leagues in the Leagues of Votann. Currently, the most influential is the Greater Thurian League. But what if, over the past two decades, the Thurian League has lost its influence and it's time for another league to prove in practice that it is now the most influential here? Which league is currently the most influential?"
 WrWrld_votann_events.10.a: "Greater Thurian League."
 WrWrld_votann_events.10.b: "Kronus Hegemony."
 WrWrld_votann_events.10.c: "Trans-Hyperian Alliance."
 WrWrld_votann_events.10.d: "Urani-Surtur Regulates."
 WrWrld_votann_events.10.e: "Ymyr Conglomerate."
 WrWrld_votann_events.10.f: "Gulo Industrial Complex in alliance with Seran-Tok Trade League."
 
 WrWrld_votann_events.11.name: "Situation with the Kin"
 WrWrld_votann_events.11.desc: "We are encountering Kin trade and other ships more and more often, and we are increasingly discovering their connection with the Tau. Apparently, the Seran-Tok Trade League, known to us as 'Demiurg' and on friendly terms with the Tau, managed to unite with the Gulo Industrial Complex, and they have become a strong alliance of two leading Leagues. It is obvious that they are preparing forces to attack us. We will have to launch a preemptive strike to protect our interests."
 WrWrld_votann_events.11.a: "We will also be able to weaken the Tau's scientific development."
 
 WrWrld_votann_events.12.name: "Situation with the Imperium"
 WrWrld_votann_events.12.desc: "Our territories have reached the point where we need expansion. The Imperium surrounds us on all sides. It hates us and does not consider us human. War with it is inevitable. Right now, it is merely a colossus with feet of clay, and there is no better time and opportunity to strike it."
 WrWrld_votann_events.12.a: "For the Ancestors!"
 
 WrWrld_votann_events.13.name: "Awakening of the Ancestor Core"
 WrWrld_votann_events.13.desc: "The Votann, whose awakening the Urani-Surtur Regulates awaited... Has finally awakened!"
 WrWrld_votann_events.13.a: "Thank you for your gifts!"
 
 WrWrld_aeldari_events.5.name: "Aid to the Qorl"
 WrWrld_aeldari_events.5.desc: "The Imperium is not our friend. It is a hostile state of a wretched and primitive race. We are united only by a common enemy in the form of Chaos, although we still sometimes come into conflict with the Imperium. In the Segmentum Pacificus, there is a race of Qorl. We maintain neutral relations with them. They could act as our proxies in the confrontation with the Imperium. Perhaps it is time to support them in creating a fleet?"
 WrWrld_aeldari_events.5.a: "Postpone aid for later."
 WrWrld_aeldari_events.5.b: "Help the Qorl create a fleet."
 
 WrWrld_aeldari_events.6.name: "Aid from the Aeldari."
 WrWrld_aeldari_events.6.desc: "The Aeldari decide to help us in the confrontation with the Imperium. We are glad for their help and accept it. Apparently, the very fact of our existence is important to them, that they are ready to demand nothing in return."
 WrWrld_aeldari_events.6.a: "Thank you."
 WrWrld_aeldari_events.6.b: "Thank you, can you help again after some time?"
 
 children_of_thorns.5.name: "Transformation of the Children of Thorns"
 children_of_thorns.5.desc: "We have been waging war against the oppressors from Commorragh. We survived for a long time, and the fact that we managed to hold out for so long already says that we will win sooner or later. It's time to transition to the model of society we want to achieve in our territories. We are finally ready to rebuild the life of society as we planned."
 children_of_thorns.5.a: "New life!"
 
 Commorragh_new_Archon.10.name: "Vect's First Mistake?"
 Commorragh_new_Archon.10.desc: "Routine reports, routine work of pitting everyone against each other and maintaining one's superiority. But what if this time Asdrubael Vect makes his first mistake?"
 Commorragh_new_Archon.10.a: "Asdrubael Vect does not make mistakes."
 Commorragh_new_Archon.10.b: "A moment of weakness will not destroy anything."
 
 Commorragh_new_Archon.11.name: "Vect's First and Last Mistake"
 Commorragh_new_Archon.11.desc: "A moment of weakness in Commorragh costs everything. Asdrubael Vect's power is rapidly crumbling. All the kabals managed to unite against him, although they split into coalitions. Which coalition will achieve more?"
 Commorragh_new_Archon.11.a: "The Dying Sun, The Iron Thorn, The Poisoned Tongue."
 Commorragh_new_Archon.11.b: "The Flayed Skull, The Obsidian Rose, The Broken Seal"
 Commorragh_new_Archon.11.c: "Death's Hate, The Severed, The Prophets of Flesh"
 
 Commorragh_new_Archon.12.name: "Infighting in the Victorious Coalition"
 Commorragh_new_Archon.12.desc: "For a month (Terran), all of Commorragh was engulfed in the flames of civil war. The victorious coalition was determined, but within its ranks, a new conflict for power has already begun. Who will emerge victorious?"
 Commorragh_new_Archon.12.a: "The Dying Sun"
 Commorragh_new_Archon.12.b: "The Iron Thorn"
 Commorragh_new_Archon.12.c: "The Poisoned Tongue"
 
 Commorragh_new_Archon.13.name: "Infighting in the Victorious Coalition"
 Commorragh_new_Archon.13.desc: "For a month (Terran), all of Commorragh was engulfed in the flames of civil war. The victorious coalition was determined, but within its ranks, a new conflict for power has already begun. Who will emerge victorious?"
 Commorragh_new_Archon.13.a: "The Flayed Skull"
 Commorragh_new_Archon.13.b: "The Obsidian Rose"
 Commorragh_new_Archon.13.c: "The Broken Seal"
 
