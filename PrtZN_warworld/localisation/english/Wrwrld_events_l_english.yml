l_english:
 WrWrld_game_start.0.name:0 "Before the game starts.."
 WrWrld_game_start.0.desc:0 "Hello player!\n\ In the first five days of the game, scripts will be activated, this will cause lags and slowdowns in performance, but then everything will pass and you can safely continue playing. The mod obviously doesn't run as fast as a regular game, but usually as the eternal war continues, the game starts to run faster. I also tried not to burden the mod with a large number of new unnecessary calculations.\n\ I plan to use this event in the future to customize the mod by the player at the start and possibly provide some details of the new update, so do not scroll through the event, but read it just in case after each update.\n\ Please also note that if you have empty systems on the map and countries appear as in a normal game and they obviously shouldn't be there, most likely you don't have enough of some necessary DLC for the mod, of course you can continue playing like this, but if you really don't like this problem, then you can independently change the files of the countries in fashion, often replacing civilian models and portraits is enough to detach the mod from problematic dls for you.\n\ It is also desirable to increase the cost of scientific research and acceptance of traditions."
 WrWrld_game_start.0.a:0 "About mod, bugs, and conventions."
 WrWrld_game_start.0.b:0 "Setup (under development)."
 WrWrld_game_start.0.c:0 "Understandably."
 
 WrWrld_game_start.1.name:0 "About mod, bugs, and conventions."
 WrWrld_game_start.1.desc:0 "Initially, this was not planned by the warhammer mod, but as a result, I tried to combine the work of many modelers before me about warhammer, so that in the future you can use this as a starting point to create your own new version of the warhammer mod.\n\ At the moment, I think it's worth clarifying the fact that the mod is still in development and I'm working on the mod alone, it's a lot of time-consuming work and I simply can't do everything here on my own, so don't, for example, tell me about broken pictures of cities, I know, but I have There are many more important tasks that directly affect the gameplay. Don't expect me to fix cities, for example, it's better to do it yourself, upload your submod to the workshop and give it a link in the comments to our mod, then I can integrate your fixes into the main mod.I've been working on the architecture of the files and I'm trying to write some instructions for the mod so that it's easier for you to figure out how to update it in the event of my death or how to make submodes on it.\n\ There is a bug in fashion at the moment that I do not know how to fix, perhaps sometimes you see an empty system that appears somewhere, this is exactly this bug, if it greatly spoils the appearance of the display of countries, it is better to restart the game, or just be patient.There are also a very large number of conventions in the mod, for example, some necron dynasties are united into one, and 2 states are separated from the Ultima segmentum to make it easier for the player to control an already large territory. For example, I also thought that exodites would be more interesting as a developed faction of isolationists, rather than as just worlds of primitive civilizations that simply have no chance of surviving in this harsh world.."
 WrWrld_game_start.1.a:0 "Go back to the start event."
 
 black_crusades.name: "The Black Crusade"
 black_crusades.desc: "A long war is underway and the scales are gradually tipping in our direction, it's time to strike a new blow at the Imperium! It's time to put aside the strife and strike on all fronts in unison!"
 black_crusades.a: "The gods give us resources from the warp, but we'll get our own savings."
 black_crusades.b: "We will think about this proposal... But even though it's not... Definitely let's get started!"

