l_english:
 building_cult_imperor_temple: "Cathedral of the Cult of the Emperor"
 building_cult_imperor_temple_desc: "The main building of the Diocese, managed by the Cardinal. It is through him that the will of the Ecclesiarch is transmitted."
 building_inquisition_branch: "The Inquisition's chambers"
 building_inquisition_branch_desc: "A place for the gathering of the Ecclesiarchy's watchdogs, the Inquisitors. Identifying and destroying the myriad potential threats to humanity is the main task of this place."
 building_convents_sororitas: "Sororitas Monastery"
 building_convents_soritas_desc: "The place of residence and service of the Sisters of Battle. These monasteries will provide security anywhere in the galaxy."
 building_convents_hospitaller: "Monastery of the Hospitaller"
 building_convents_hospitaller_desc: "These monasteries take the form of hospitals and shelters, they are created to heal and provide medical care to all citizens of the Imperium."

