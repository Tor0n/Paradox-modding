ass_ps_01_shipset_desc: "A chaotic and menacing shipset crafted from salvaged hulls, stolen tech, and sheer audacity. These ships boast asymmetrical designs, exposed machinery, jagged armor, and aggressive silhouettes. Perfect for outlaw empires, raider clans, or anyone who sees the galaxy as ripe for plunder and profit—rules be damned."
